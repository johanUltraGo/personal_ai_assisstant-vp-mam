<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>VP Assistant · voice</title>
  <meta name="description" content="Talk to the Vice Principal assistant in Tamil or English, with today's schedule and the parents' group beside the conversation." />
  <meta name="theme-color" content="#FBFBFC" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" type="image/png" href="/icons/icon-192.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&family=Public+Sans:wght@400;500;600;700&family=Noto+Sans+Tamil:wght@400;500;600&display=swap" />
  <link rel="stylesheet" href="voice/voice.css" />
</head>
<body data-state="idle">
  <header class="bar">
    <a class="wordmark" href="/"><img class="wordmark-logo" src="img/school-logo.png" alt="Wisdom Wealth International School" width="407" height="218"><span>vp assistant</span></a>
    <a class="pill-link" href="/">full app</a>
  </header>

  <aside class="rail" aria-label="Today and the parents’ group">
    <details class="panel" id="panel-schedule">
      <summary class="panel-summary">
        <h2 class="panel-head">Today’s schedule</h2>
        <span class="panel-count" id="schedule-count"></span>
      </summary>
      <div class="panel-body">
        <ol class="rows schedule" id="schedule-list" aria-busy="true">
          <li class="skeleton" aria-hidden="true"></li>
          <li class="skeleton" aria-hidden="true"></li>
          <li class="skeleton" aria-hidden="true"></li>
        </ol>
        <p class="panel-note" id="schedule-confirmed" hidden>You confirmed today’s list.</p>
        <h3 class="panel-sub">Coming up</h3>
        <ul class="rows events" id="events-list" aria-busy="true">
          <li class="skeleton" aria-hidden="true"></li>
          <li class="skeleton" aria-hidden="true"></li>
        </ul>
        <div class="sync">
          <button class="pill" id="sync-calendar" type="button">sync school calendar</button>
          <p class="panel-note" id="sync-status" aria-live="polite"></p>
        </div>
      </div>
    </details>

    <details class="panel" id="panel-parents">
      <summary class="panel-summary">
        <h2 class="panel-head">Parents’ group</h2>
        <span class="panel-count" id="parents-count"></span>
      </summary>
      <div class="panel-body">
        <h3 class="panel-sub">Notices waiting for your answer</h3>
        <ul class="rows notices" id="notice-list" aria-busy="true">
          <li class="skeleton" aria-hidden="true"></li>
        </ul>
        <h3 class="panel-sub">Last messages sent</h3>
        <ul class="rows sent" id="sent-recent" aria-busy="true">
          <li class="skeleton" aria-hidden="true"></li>
          <li class="skeleton" aria-hidden="true"></li>
        </ul>
      </div>
    </details>
  </aside>

  <main class="stage">
    <h1 class="visually-hidden">Talk to the assistant</h1>
    <section class="exchange" aria-live="polite" aria-label="Conversation">
      <div class="bubble bubble-you">
        <p class="bubble-meta">you <span class="bubble-lang" id="heard-lang"></span></p>
        <p class="heard" id="heard"></p>
      </div>
      <div class="bubble bubble-reply">
        <p class="bubble-meta">assistant <span class="bubble-lang" id="reply-lang"></span></p>
        <p class="reply" id="reply">Tap the crystal and speak. Tamil, English or both.</p>
      </div>
      <div class="cards" id="cards"></div>
    </section>
    <noscript><p class="reply">Voice needs JavaScript. <a href="/">Open the full app</a> to type instead.</p></noscript>
  </main>

  <footer class="dock">
    <button class="crystal" id="orb" type="button" aria-label="Tap to talk">
      <span class="crystal-halo" aria-hidden="true"></span>
      <svg class="crystal-svg" viewBox="0 0 200 200" aria-hidden="true" focusable="false">
        <defs>
          <linearGradient id="cg-teal" gradientUnits="userSpaceOnUse" x1="40" y1="20" x2="160" y2="180"><stop class="s-teal-1" offset="0"/><stop class="s-teal-2" offset="0.5"/><stop class="s-teal-3" offset="1"/></linearGradient>
          <linearGradient id="cg-gold" gradientUnits="userSpaceOnUse" x1="160" y1="20" x2="40" y2="180"><stop class="s-gold-1" offset="0"/><stop class="s-gold-2" offset="0.55"/><stop class="s-gold-3" offset="1"/></linearGradient>
        </defs>
        <polygon class="ring" points="100,6 181.4,53 181.4,147 100,194 18.6,147 18.6,53"/>
        <polygon class="ring ring-2" points="100,6 181.4,53 181.4,147 100,194 18.6,147 18.6,53"/>
        <g class="gem">
          <g class="crown">
            <g class="layer layer-teal"><polygon points="100,20 100,62 132.9,81"/><polygon points="100,20 169.3,60 132.9,81"/><polygon points="169.3,60 132.9,81 132.9,119"/><polygon points="169.3,60 169.3,140 132.9,119"/><polygon points="169.3,140 132.9,119 100,138"/><polygon points="169.3,140 100,180 100,138"/><polygon points="100,180 100,138 67.1,119"/><polygon points="100,180 30.7,140 67.1,119"/><polygon points="30.7,140 67.1,119 67.1,81"/><polygon points="30.7,140 30.7,60 67.1,81"/><polygon points="30.7,60 67.1,81 100,62"/><polygon points="30.7,60 100,20 100,62"/></g>
            <g class="layer layer-gold"><polygon points="100,20 100,62 132.9,81"/><polygon points="100,20 169.3,60 132.9,81"/><polygon points="169.3,60 132.9,81 132.9,119"/><polygon points="169.3,60 169.3,140 132.9,119"/><polygon points="169.3,140 132.9,119 100,138"/><polygon points="169.3,140 100,180 100,138"/><polygon points="100,180 100,138 67.1,119"/><polygon points="100,180 30.7,140 67.1,119"/><polygon points="30.7,140 67.1,119 67.1,81"/><polygon points="30.7,140 30.7,60 67.1,81"/><polygon points="30.7,60 67.1,81 100,62"/><polygon points="30.7,60 100,20 100,62"/></g>
            <g class="layer layer-light"><polygon class="l4" points="100,20 100,62 132.9,81"/><polygon class="l4" points="100,20 169.3,60 132.9,81"/><polygon class="l2" points="169.3,60 132.9,81 132.9,119"/><polygon class="l2" points="169.3,60 169.3,140 132.9,119"/><polygon class="l1" points="169.3,140 132.9,119 100,138"/><polygon class="l1" points="169.3,140 100,180 100,138"/><polygon class="l2" points="100,180 100,138 67.1,119"/><polygon class="l2" points="100,180 30.7,140 67.1,119"/><polygon class="l4" points="30.7,140 67.1,119 67.1,81"/><polygon class="l4" points="30.7,140 30.7,60 67.1,81"/><polygon class="l5" points="30.7,60 67.1,81 100,62"/><polygon class="l5" points="30.7,60 100,20 100,62"/></g>
          </g>
          <g class="table">
            <g class="layer layer-teal"><polygon points="100,100 100,62 132.9,81"/><polygon points="100,100 132.9,81 132.9,119"/><polygon points="100,100 132.9,119 100,138"/><polygon points="100,100 100,138 67.1,119"/><polygon points="100,100 67.1,119 67.1,81"/><polygon points="100,100 67.1,81 100,62"/></g>
            <g class="layer layer-gold"><polygon points="100,100 100,62 132.9,81"/><polygon points="100,100 132.9,81 132.9,119"/><polygon points="100,100 132.9,119 100,138"/><polygon points="100,100 100,138 67.1,119"/><polygon points="100,100 67.1,119 67.1,81"/><polygon points="100,100 67.1,81 100,62"/></g>
            <g class="layer layer-light"><polygon class="l4" points="100,100 100,62 132.9,81"/><polygon class="l2" points="100,100 132.9,81 132.9,119"/><polygon class="l1" points="100,100 132.9,119 100,138"/><polygon class="l2" points="100,100 100,138 67.1,119"/><polygon class="l4" points="100,100 67.1,119 67.1,81"/><polygon class="l5" points="100,100 67.1,81 100,62"/></g>
          </g>
          <g class="edges"><polygon points="100,20 100,62 132.9,81"/><polygon points="100,20 169.3,60 132.9,81"/><polygon points="169.3,60 132.9,81 132.9,119"/><polygon points="169.3,60 169.3,140 132.9,119"/><polygon points="169.3,140 132.9,119 100,138"/><polygon points="169.3,140 100,180 100,138"/><polygon points="100,180 100,138 67.1,119"/><polygon points="100,180 30.7,140 67.1,119"/><polygon points="30.7,140 67.1,119 67.1,81"/><polygon points="30.7,140 30.7,60 67.1,81"/><polygon points="30.7,60 67.1,81 100,62"/><polygon points="30.7,60 100,20 100,62"/><polygon points="100,100 100,62 132.9,81"/><polygon points="100,100 132.9,81 132.9,119"/><polygon points="100,100 132.9,119 100,138"/><polygon points="100,100 100,138 67.1,119"/><polygon points="100,100 67.1,119 67.1,81"/><polygon points="100,100 67.1,81 100,62"/></g>
        </g>
      </svg>
    </button>
    <p class="status" id="status" role="status">tap to talk</p>
    <form class="type-form" id="type-form" hidden>
      <label class="sr-only" for="type-input">Type your request</label>
      <input id="type-input" name="request" type="text" autocomplete="off" placeholder="Remind me at 4 to call Mrs Iyer" />
      <button class="pill pill-solid" type="submit">ask</button>
    </form>
    <div class="dock-actions">
      <button class="pill" id="type-toggle" type="button">type instead</button>
      <button class="pill" id="listen-lang" type="button" aria-pressed="false">speak Tamil instead</button>
    </div>
  </footer>

  <div class="pin" id="pin" hidden>
    <form class="pin-box" id="pin-form">
      <h2 class="pin-head">your pin</h2>
      <label class="sr-only" for="pin-input">Access PIN</label>
      <input id="pin-input" name="pin" type="password" inputmode="numeric" autocomplete="current-password" required />
      <button class="pill pill-solid" type="submit">open</button>
      <p class="pin-error" id="pin-error" aria-live="polite"></p>
    </form>
  </div>

  <script type="module" src="/js/voice.js"></script>
</body>
</html>
